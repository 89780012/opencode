<body class="bg-background text-foreground antialiased h-screen overflow-hidden">
    <div id="app" class="flex h-screen w-full overflow-hidden"></div>
    <div id="toast-container" class="fixed top-5 right-5 z-[9999] flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">
        const createEl = (tag, attrs = {}, ...children) => {
            const el = document.createElement(tag);
            Object.entries(attrs).forEach(([k, v]) => {
                if (k === 'className') el.className = v;
                else if (k === 'innerHTML') el.innerHTML = v;
                else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
                else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
                else if (typeof v === 'boolean') { if (v) el.setAttribute(k, ''); } else if (v !==
                    undefined) el.setAttribute(k, v);
            });
            children.forEach(c => { if (typeof c === 'string') el.appendChild(document.createTextNode(c));
                else if (c instanceof Node) el.appendChild(c); });
            return el;
        };

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const colorMap = { success: 'bg-emerald-50 border-emerald-300 text-emerald-800',
                error: 'bg-red-50 border-red-300 text-red-800', info: 'bg-sky-50 border-sky-300 text-sky-800',
                warning: 'bg-amber-50 border-amber-300 text-amber-800' };
            const iconMap = { success: 'check-circle', error: 'x-circle', info: 'info', warning: 'alert-triangle' };
            const toast = createEl('div', { className: `toast pointer-events-auto flex items-center gap-2.5 px-4 py-2.5 rounded-lg border shadow-md bg-white ${colorMap[type]} text-sm font-medium` });
            toast.innerHTML =
                `<span class="w-4 h-4" data-lucide="${iconMap[type]}"></span><span>${msg}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => toast.remove(), 3200);
        }

        const MAX_REVIEW_ROUNDS = 4;

        function generateTimelineEvents(sessionName) {
            const baseDate = new Date();
            const fmt = (d) => d.toISOString().slice(0, 16).replace('T', ' ');
            const addMin = (min) => new Date(baseDate.getTime() + min * 60000);
            return [
                { id: 'evt-req-1', type: 'requirement', label: '需求理解', time: fmt(addMin(-280)),
                    description: `确认「${sessionName}」核心需求`, status: 'done', icon: 'file-text' },
                { id: 'evt-code-1', type: 'code', label: '代码编写', time: fmt(addMin(-230)),
                    description: '生成策略代码框架 v1.0', status: 'done', icon: 'code2' },
                { id: 'evt-git-1', type: 'git', label: 'Git 提交', time: fmt(addMin(-200)),
                    description: '初始提交：双均线策略骨架', commitHash: 'a7f3b2c', status: 'done', icon: 'git-commit',
                    diffSummary: '新增 DualMAStrategy 类，包含 __init__ 和 on_bar 方法' },
                { id: 'evt-review-1', type: 'review', label: '代码审查', time: fmt(addMin(-150)),
                    description: '第1轮审查 — 发现止损逻辑缺陷', status: 'done', icon: 'clipboard-check' },
                { id: 'evt-git-2', type: 'git', label: 'Git 提交', time: fmt(addMin(-120)),
                    description: '修复：止损边界条件 & 空值保护', commitHash: 'b8e4c9d', status: 'done', icon: 'git-commit',
                    diffSummary: '在 on_bar 中添加滑点保护；持仓判断增加市场关闭场景处理' },
                { id: 'evt-review-2', type: 'review', label: '代码审查', time: fmt(addMin(-80)),
                    description: '第2轮审查 — 全部通过 ✅', status: 'done', icon: 'clipboard-check' },
                { id: 'evt-flowchart-1', type: 'flowchart', label: '流程图生成', time: fmt(addMin(-60)),
                    description: '自动生成策略流程图', status: 'done', icon: 'workflow' },
                { id: 'evt-git-3', type: 'git', label: 'Git 提交', time: fmt(addMin(-40)),
                    description: '最终版本：审查通过后提交', commitHash: 'd9f5e0a', status: 'done', icon: 'git-commit',
                    diffSummary: '整合审查反馈，优化代码规范，添加完整注释' },
                { id: 'evt-backtest-1', type: 'backtest', label: '回测验证', time: fmt(addMin(-15)),
                    description: '回测完成：累计收益 +12.5%，夏普 1.82', status: 'done', icon: 'bar-chart-3' },
            ];
        }

        const createEmptySession = (name = "新策略") => ({
            id: crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random(),
            name,
            createdAt: new Date().toISOString(),
            sessionMessages: [],
            currentRequirement: '双均线策略：5日上穿20日买入，2%止损5%止盈',
            analyzedRequirements: ['5日均线上穿20日均线 → 产生买入信号', '持仓亏损达2% → 触发止损平仓', '持仓盈利达5% → 触发止盈平仓',
                '使用 calc_sma 方法计算移动平均线', '在 on_bar 中逐根K线判断交易信号'
            ],
            reviewStatus: 'idle',
            reviewRound: 0,
            reviewHistory: [],
            reviewProgress: null,
            reviewViewMode: 'current',
            flowchartCode: null,
            flowchartStatus: 'idle',
            flowchartHistory: [],
            backtestResults: null,
            isBacktesting: false,
            backtestRound: 1,
            backtestStatus: 'idle',
            backtestHistory: [],
            compactPanelStates: { requirements: true, logic: true, progress: true, backtest: true },
            timelineEvents: generateTimelineEvents(name),
            codeContent: `# 双均线策略 (Dual MA)
        class DualMAStrategy:
            def __init__(self, fast=5, slow=20):
                self.fast = fast
                self.slow = slow
                self.position = 0
                self.entry_price = 0

            def on_bar(self, bar):
                fast_ma = self.calc_sma(self.fast)
                slow_ma = self.calc_sma(self.slow)
                if fast_ma > slow_ma and self.position <= 0:
                    self.buy(bar.close)
                    self.entry_price = bar.close
                elif fast_ma < slow_ma and self.position >= 0:
                    self.sell(bar.close)

                if self.position > 0:
                    if bar.close <= self.entry_price * 0.98:
                        self.sell(bar.close)
                    elif bar.close >= self.entry_price * 1.05:
                        self.sell(bar.close)

            def calc_sma(self, period):
                prices = self.get_prices(period)
                return sum(prices) / len(prices) if prices else 0`
        });

        const defaultSession = createEmptySession("双均线策略");
        defaultSession.sessionMessages = [
            { role: 'ai',
                content: '<p class="font-medium mb-0.5">👋 策略助手已就绪</p><p class="text-muted-foreground text-xs">左侧边栏双标签页：「需求面板」为紧凑垂直布局，「会话列表」管理多策略。底部输入面板始终可见，可随时输入修改意见。</p>' },
            { role: 'user', content: '双均线策略：5日上穿20日买入，2%止损5%止盈' },
            { role: 'ai',
                content: '<p>已生成双均线策略框架，请查看右侧代码区。满意后可提交审查，审查未通过我会给出具体建议并推送至聊天区。</p>' }
        ];

        const secondSession = createEmptySession("震荡突破策略");
        secondSession.currentRequirement = '震荡突破策略：布林带中轨突破 + 成交量过滤，3%跟踪止损';
        secondSession.analyzedRequirements = [

        function drawEquityChart(data) { const canvas = document.getElementById('equity-chart'); if (!canvas || !data)
            return;
            const wrapper = canvas.parentElement,
                rect = wrapper.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
            const ctx = canvas.getContext('2d');
            ctx.scale(2, 2);
            const w = rect.width,
                h = rect.height,
                pad = { top: 12, right: 12, bottom: 22, left: 48 };
            const vals = data.map(d => d.equity),
                min = Math.min(...vals) * 0.995,
                max = Math.max(...vals) * 1.005;
            ctx.fillStyle = '#f9fafb';
            ctx.fillRect(0, 0, w, h);
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 0.8; for (let i = 0; i <= 4; i++) { const y = pad.top + ((h - pad.top - pad.bottom) / 4) * i;
                ctx.beginPath();
                ctx.moveTo(pad.left, y);
                ctx.lineTo(w - pad.right, y);
                ctx.stroke(); }
            ctx.beginPath();
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 2.2;
            const pw = w - pad.left - pad.right,
                ph = h - pad.top - pad.bottom;
            data.forEach((pt, i) => { const x = pad.left + (i / (data.length - 1)) * pw;
                const y = pad.top + ((max - pt.equity) / (max - min)) * ph; if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y); });
            ctx.stroke(); }

                    const row = createEl('div', { className: 'flex items-start gap-2 text-xs text-gray-700' });
                    row.innerHTML =
                        `<span class="text-primary font-bold mt-0.5 flex-shrink-0">${idx + 1}.</span><span class="leading-relaxed">${req}</span>`;
                    div.appendChild(row);
                });
                return div;
            }));

            container.appendChild(createCompactSection('logic', '策略逻辑蓝图', 'git-graph', session, () => {
                const statusParts = [];
                if (session.reviewStatus === 'passed') statusParts.push('✅ 审查已通过');
                else if (session.reviewStatus === 'failed') statusParts.push('⚠️ 审查未通过，需修改');
                else if (session.reviewStatus === 'running') statusParts.push('🔍 审查进行中');
                else statusParts.push('📝 代码待审查');
                if (session.flowchartStatus === 'done') statusParts.push('流程图已生成');
                if (session.backtestStatus === 'done' && session.backtestResults) statusParts.push(
                    `回测收益 ${session.backtestResults.totalReturn}%`);
                const descText = statusParts.length > 0 ? statusParts.join(' · ') : '策略框架已搭建，等待后续操作';
                const div = createEl('div', { className: 'space-y-2' });
                div.appendChild(createEl('p', { className: 'text-xs text-gray-600 leading-relaxed' }, descText));
                div.appendChild(createEl('p', { className: 'text-[10px] text-muted-foreground' },
                    `需求: ${session.currentRequirement}`));
                return div;
            }, () => {
                const btn = createEl('button', {
                    className: 'section-header-btn',
                    onclick: (e) => { e.stopPropagation();
                        stage = 'flowchart';
                        renderApp(); },
                    title: '查看流程图',
                });
                btn.innerHTML =
                    '<span class="w-3 h-3" data-lucide="workflow"></span><span class="hidden sm:inline">流程图</span>';
                return btn;
            }));

            container.appendChild(createCompactSection('progress', '进度追踪', 'clock', session, () => {
                const steps = [
                    { key: 'requirement', label: '需求确认', icon: 'file-check' },
                    { key: 'code', label: '代码编写', icon: 'code2' },
                    { key: 'review', label: '代码审查', icon: 'clipboard-check' },
                    { key: 'flowchart', label: '流程图生成', icon: 'workflow' },
                    { key: 'backtest', label: '回测验证', icon: 'bar-chart-3' },
                ];
                const getStepStatus = (key) => {
                    switch (key) {
                        case 'requirement':
                            return 'done';
                        case 'code':
                            return 'done';
                        case 'review':
                            if (session.reviewStatus === 'running') return 'running';
                            if (session.reviewStatus === 'passed' || session.reviewStatus === 'failed')
                                return 'done';
                            return 'pending';
                        case 'flowchart':
                            if (session.flowchartStatus === 'generating') return 'running';
                            if (session.flowchartStatus === 'done') return 'done';
                            return 'pending';
                        case 'backtest':
                            if (session.isBacktesting || session.backtestStatus === 'running') return 'running';
                            if (session.backtestStatus === 'done') return 'done';
                            return 'pending';
                        default:
                            return 'pending';
                    }
                };
                const containerDiv = createEl('div', { className: 'space-y-1' });
                steps.forEach((step) => {
                    const status = getStepStatus(step.key);
                    let iconColor = 'text-gray-400';
                    let bgColor = 'bg-gray-100';
                    if (status === 'done') { iconColor = 'text-emerald-500';
                        bgColor = 'bg-emerald-50'; } else if (status === 'running') { iconColor =
                        'text-blue-500 animate-pulse';
                        bgColor = 'bg-blue-50'; }
                    const row = createEl('div', { className: `progress-step-item ${bgColor}` });
                    const iconSpan = createEl('span', { className: `w-4 h-4 ${iconColor} flex-shrink-0` });
                    if (status === 'done') iconSpan.innerHTML =
                        '<span class="w-4 h-4" data-lucide="check-circle"></span>';
                    else if (status === 'running') iconSpan.innerHTML =
                        '<span class="w-4 h-4" data-lucide="loader-2"></span>';
                    else iconSpan.innerHTML =
                        `<span class="w-4 h-4" data-lucide="${step.icon}"></span>`;
                    const labelSpan = createEl('span', { className: 'text-xs font-medium' }, step.label);
                    row.appendChild(iconSpan);
                    row.appendChild(labelSpan);
                    containerDiv.appendChild(row);
                });
                return containerDiv;
            }, () => {
                const btn = createEl('button', {
                    className: 'section-header-btn',
                    onclick: (e) => { e.stopPropagation();
                        openTimelineTab(); },
                    title: '查看时间线',
                });
                btn.innerHTML =
                    '<span class="w-3 h-3" data-lucide="clock"></span><span class="hidden sm:inline">时间线</span>';
                return btn;
            }));

            container.appendChild(createCompactSection('backtest', '回测记录', 'bar-chart-3', session, () => {
                const history = session.backtestHistory;
                if (!history.length) return createEl('div', { className: 'text-xs text-muted-foreground' },
                    '暂无回测记录');
                const list = createEl('div', { className: 'space-y-1' });
                [...history].reverse().forEach((b, idx) => {
                    const item = createEl('div', { className: 'p-1.5 text-xs cursor-pointer hover:bg-gray-100 rounded',
                        onclick: () => { session.backtestResults = b.results;
                            stage = 'backtest';
                            renderApp(); } });
                    item.innerHTML =
                        `<div class="flex justify-between"><span class="font-medium">回测 #${history.length-idx}</span><span class="text-[10px] text-muted-foreground">${b.time}</span></div><div class="text-[10px] mt-0.5">收益: ${b.results.totalReturn}% · 夏普: ${b.results.sharpeRatio}</div>`;
                    list.appendChild(item);
                });
                return list;
            }));

            return container;
        }

        function createCompactSection(key, title, icon, session, contentRenderer, headerActionsRenderer) {
            const expanded = session.compactPanelStates?.[key] !== false;
            const wrapper = createEl('div', {
                className: `flex flex-col border-b border-border transition-all ${expanded ? 'flex-1 min-h-0' : 'flex-none'}`
            });

            const header = createEl('div', { className: 'compact-section-header', onclick: () => { if (!session
                        .compactPanelStates) session.compactPanelStates = {};
                    session.compactPanelStates[key] = !session.compactPanelStates[key];
                    renderApp(); } });

            const leftPart = createEl('div', { className: 'flex items-center gap-1.5' });
            const chevronSpan = createEl('span', {
                className: `w-3.5 h-3.5 transition-transform ${expanded ? 'rotate-90' : ''}`,
                'data-lucide': 'chevron-right',
            });
            leftPart.appendChild(chevronSpan);
            leftPart.appendChild(createEl('span', { className: 'w-3.5 h-3.5', 'data-lucide': icon }));
            leftPart.appendChild(createEl('span', {}, title));
            header.appendChild(leftPart);

            const rightPart = createEl('div', { className: 'flex items-center gap-1.5' });
            if (headerActionsRenderer) {
                const actionsEl = headerActionsRenderer();
                if (actionsEl) {

                    rightPart.appendChild(actionsEl);

            }

                className: `w-3.5 h-3.5 text-muted-foreground transition-transform ${expanded ? 'rotate-180' : ''}`,
                'data-lucide': 'chevron-down',
            }));
            header.appendChild(rightPart);

            const contentDiv = createEl('div', { className: `${expanded ? 'flex-1 overflow-y-auto custom-scrollbar px-3 py-2.5' : 'hidden'}` });
            contentDiv.appendChild(contentRenderer());
            wrapper.appendChild(header);
            wrapper.appendChild(contentDiv);
            return wrapper;
        }

        function renderTimelineView() {
            const session = getActiveSession();
            const container = createEl('div', { className: 'flex flex-col h-full bg-white' });

            const toolbar = createEl('div', { className: 'flex items-center justify-between px-4 py-2.5 border-b border-border bg-gray-50/90 flex-shrink-0 gap-3 flex-wrap' });
            const leftToolbar = createEl('div', { className: 'flex items-center gap-2' });
            leftToolbar.innerHTML =
                '<span class="w-4 h-4 text-indigo-600" data-lucide="clock"></span><span class="text-sm font-semibold text-gray-800">策略时间线</span><span class="text-[10px] text-muted-foreground bg-gray-200 px-2 py-0.5 rounded-full">滚轮缩放 · 自由拖拽</span>';
            toolbar.appendChild(leftToolbar);
            const rightToolbar = createEl('div', { className: 'flex items-center gap-2' });
            const zoomOutBtn = createEl('button', { className: 'zoom-control-btn', onclick: () => { timelineZoom = Math
                        .max(0.2, timelineZoom - 0.1);

            zoomOutBtn.innerHTML = '−';
            const zoomBadge = createEl('span', { className: 'zoom-level-badge', id: 'zoom-level-badge' });
            zoomBadge.textContent = Math.round(timelineZoom * 100) + '%';
            const zoomInBtn = createEl('button', { className: 'zoom-control-btn', onclick: () => { timelineZoom = Math
                        .min(2.5, timelineZoom + 0.1);
                    applyTimelineTransform(true);
                    updateZoomBadge(); } });
            zoomInBtn.innerHTML = '+';
            const resetBtn = createEl('button', { className: 'zoom-control-btn text-xs font-medium', style: { width: 'auto',
                    padding: '0 10px' }, onclick: () => { timelineZoom = 1.0;
                    timelinePanX = 0;
                    timelinePanY = 0;
                    applyTimelineTransform(true);
                    updateZoomBadge();
                    showToast('视图已重置', 'info'); } });
            resetBtn.textContent = '↺ 重置';
            const closeBtn = createEl('button', { className: 'px-3 py-1.5 text-xs rounded-lg border border-gray-300 hover:bg-gray-100 transition-colors',

            closeBtn.textContent = '关闭';
            rightToolbar.appendChild(zoomOutBtn);
            rightToolbar.appendChild(zoomBadge);
            rightToolbar.appendChild(zoomInBtn);
            rightToolbar.appendChild(resetBtn);
            rightToolbar.appendChild(closeBtn);
            toolbar.appendChild(rightToolbar);
            container.appendChild(toolbar);

            const canvasWrapper = createEl('div', { className: 'flex-1 relative overflow-hidden bg-[#fafbfc]', id: 'timeline-canvas-wrapper' });
            const canvasContainer = createEl('div', { className: 'timeline-canvas-container absolute inset-0',
                id: 'timeline-canvas-container', onmousedown: (e) => startTimelinePan(e), onwheel: (e) =>
                handleTimelineWheel(e) });
            const canvasInner = createEl('div', { className: 'timeline-inner', id: 'timeline-canvas-inner',
                style: { transform: `scale(${timelineZoom}) translateX(${timelinePanX}px) translateY(${timelinePanY}px)` } });
            canvasContainer.appendChild(canvasInner);
            const tooltipEl = createEl('div', { className: 'tl-tooltip', id: 'tl-tooltip' });
            canvasContainer.appendChild(tooltipEl);
            canvasWrapper.appendChild(canvasContainer);
            container.appendChild(canvasWrapper);

            const hasSelectedGitNodes = selectedGitNodeIds.size > 0;
            const analysisPanel = createEl('div', { className: 'flex-shrink-0 border-t border-border bg-white', id: 'timeline-analysis-panel' });
            if (hasSelectedGitNodes || timelineAnalysisState.result || timelineAnalysisState.isAnalyzing) {
                const panelHeader = createEl('div', { className: 'flex items-center justify-between px-4 py-2.5 bg-indigo-50/70 border-b border-indigo-100 flex-wrap gap-2' });
                panelHeader.innerHTML =
                    `<div class="flex items-center gap-2"><span class="w-4 h-4 text-indigo-600" data-lucide="git-compare"></span><span class="text-sm font-semibold text-indigo-800">Git 节点分析</span><span class="text-[10px] bg-indigo-200 text-indigo-700 px-2 py-0.5 rounded-full">已选 ${selectedGitNodeIds.size} 个节点</span></div>`;
                if (timelineAnalysisState.selectedNodes.length > 0) {
                    const nodeTags = createEl('div', { className: 'flex gap-1.5 flex-wrap' });
                    timelineAnalysisState.selectedNodes.forEach(n => {
                        nodeTags.appendChild(createEl('span', { className: 'text-[10px] bg-white border border-indigo-200 rounded px-1.5 py-0.5 font-mono text-indigo-700' },
                            n.commitHash));
                    });
                    panelHeader.appendChild(nodeTags);
                }
                analysisPanel.appendChild(panelHeader);
                const panelBody = createEl('div', { className: 'px-4 py-3 space-y-3' });
                const textarea = createEl('textarea', { className: 'w-full resize-none rounded-lg border border-border px-3 py-2.5 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-400/30 focus:border-indigo-400 transition-all',
                    rows: '2', placeholder: '输入分析需求，例如：分析这两个提交之间的代码差异、评估风控逻辑的改进...',
                    value: timelineAnalysisState.inputText, oninput: (e) => { timelineAnalysisState.inputText = e.target
                            .value; } });
                panelBody.appendChild(textarea);

                const submitBtn = createEl('button', { className: 'px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs font-medium hover:bg-indigo-700 transition-colors flex items-center gap-1.5 disabled:opacity-50',
                    onclick: handleTimelineAnalysisSubmit, disabled: timelineAnalysisState.isAnalyzing });
                submitBtn.innerHTML =
                    '<span class="w-3.5 h-3.5" data-lucide="sparkles"></span> 提交AI分析';
                btnRow.appendChild(submitBtn);
                const clearBtn = createEl('button', { className: 'px-3 py-2 border border-gray-300 rounded-lg text-xs hover:bg-gray-50 transition-colors',
                    onclick: () => { selectedGitNodeIds.clear();
                        updateTimelineAnalysisSelection();
                        renderApp(); } });
                clearBtn.textContent = '清除选择';
                btnRow.appendChild(clearBtn);

                    const loadingDiv = createEl('div', { className: 'flex items-center gap-2 py-2' });
                    loadingDiv.innerHTML =

                    const diffContainer = createEl('div', { className: 'bg-gray-50 rounded-lg p-3 space-y-0.5 max-h-48 overflow-y-auto custom-scrollbar font-mono' });
                    timelineAnalysisState.result.diffLines.forEach(dl => {
                        diffContainer.appendChild(createEl('div', { className: `diff-line ${dl.type}` },
                            dl.text));
                    });
                    resultDiv.appendChild(diffContainer);
                    panelBody.appendChild(resultDiv);

                analysisPanel.appendChild(panelBody);
            } else {
                const hintDiv = createEl('div', { className: 'px-4 py-3 text-center' });
                hintDiv.innerHTML =
                    '<span class="text-xs text-muted-foreground">💡 在时间线中点击 Git 节点（紫色圆点）进行选择，然后在此处提交 AI 分析</span>';
                analysisPanel.appendChild(hintDiv);

            setTimeout(() => {
                renderTimelineCanvasContent();
                lucide.createIcons();

        function showTimelineTooltip(evt, nodeEl) {
            if (!tlTooltipEl) tlTooltipEl = document.getElementById('tl-tooltip');
            if (!tlTooltipEl || !nodeEl) return;
            if (tlTooltipTimeout) clearTimeout(tlTooltipTimeout);

            const isGit = evt.type === 'git';
            let html = `<div class="tt-title">${evt.label}</div>`;
            html += `<div class="tt-row"><strong>时间:</strong> ${evt.time}</div>`;
            html += `<div class="tt-row"><strong>描述:</strong> ${evt.description}</div>`;
            if (isGit && evt.commitHash) {
                html += `<span class="tt-hash">${evt.commitHash}</span>`;
                if (evt.diffSummary) {
                    html += `<div class="tt-row" style="margin-top:4px;"><strong>变更:</strong> ${evt.diffSummary}</div>`;
                }
            }
            if (isGit) {
                html +=
                    `<div class="tt-row" style="margin-top:3px;color:#a5b4fc;">💡 点击可选择此节点进行AI分析</div>`;
            }
            tlTooltipEl.innerHTML = html;
            tlTooltipEl.classList.add('visible');

            const container = document.getElementById('timeline-canvas-container');
            const containerRect = container ? container.getBoundingClientRect() : { left: 0, top: 0 };
            const nodeRect = nodeEl.getBoundingClientRect();
            const tooltipWidth = tlTooltipEl.offsetWidth || 260;
            const tooltipHeight = tlTooltipEl.offsetHeight || 120;

            let left = nodeRect.left - containerRect.left + nodeRect.width / 2 - tooltipWidth / 2;
            let top = nodeRect.top - containerRect.top - tooltipHeight - 10;

            const cw = container ? container.clientWidth : window.innerWidth;
            const ch = container ? container.clientHeight : window.innerHeight;
            if (left < 8) left = 8;
            if (left + tooltipWidth > cw - 8) left = cw - tooltipWidth - 8;
            if (top < 8) {
                top = nodeRect.bottom - containerRect.top + 10;
                if (top + tooltipHeight > ch - 8) top = ch - tooltipHeight - 8;
            }

            tlTooltipEl.style.left = left + 'px';
            tlTooltipEl.style.top = top + 'px';
        }

        function hideTimelineTooltip() {
            if (tlTooltipTimeout) clearTimeout(tlTooltipTimeout);
            tlTooltipTimeout = setTimeout(() => {
                if (tlTooltipEl) tlTooltipEl.classList.remove('visible');
            }, 120);
        }

        function cancelTooltipHide() {
            if (tlTooltipTimeout) clearTimeout(tlTooltipTimeout);
        }

        function renderTimelineCanvasContent() {
            const canvasInner = document.getElementById('timeline-canvas-inner');
            if (!canvasInner) return;
            canvasInner.innerHTML = '';
            const session = getActiveSession();
            const events = session.timelineEvents || [];
            if (events.length === 0) {
                canvasInner.innerHTML =
                    '<div class="flex items-center justify-center h-full text-muted-foreground text-sm">暂无时间线事件</div>';
                return;
            }
            const canvasWrapper = document.getElementById('timeline-canvas-wrapper');
            const wrapperWidth = canvasWrapper ? canvasWrapper.clientWidth : 800;
            const wrapperHeight = canvasWrapper ? canvasWrapper.clientHeight : 600;
            const totalHeight = Math.max(wrapperHeight * 2.2, events.length * 100);
            const axisX = wrapperWidth * 0.25;
            const topPad = 60;
            const bottomPad = 60;
            const usableHeight = totalHeight - topPad - bottomPad;
            canvasInner.style.height = totalHeight + 'px';
            canvasInner.style.width = wrapperWidth + 'px';
            applyTimelineTransform(false);

            const axisLine = createEl('div', { className: 'tl-axis-line',
                style: { top: topPad + 'px', left: axisX + 'px', height: usableHeight + 'px' } });
            canvasInner.appendChild(axisLine);

            events.forEach((evt, idx) => {
                const yPos = topPad + (idx / Math.max(events.length - 1, 1)) * usableHeight;
                const isRight = idx % 2 === 0;
                const isGit = evt.type === 'git';
                const isSelected = isGit && selectedGitNodeIds.has(evt.id);

                const nodeEl = createEl('div', {
                    className: `tl-node ${isGit ? 'git-node' : ''} ${isSelected ? 'selected' : ''}`,
                    style: { top: (yPos - 12) + 'px', left: (isRight ? axisX + 40 : axisX - 180) + 'px' },
                    'data-node-id': evt.id,
                    onclick: (e) => {
                        if (isGit && !e.target.closest('.tl-node-checkbox')) {
                            toggleGitNodeSelection(evt.id);
                        }
                    },
                    onmouseenter: (e) => { cancelTooltipHide();
                        showTimelineTooltip(evt, nodeEl); },
                    onmouseleave: () => { hideTimelineTooltip(); },
                    onmousemove: (e) => { cancelTooltipHide();
                        showTimelineTooltip(evt, nodeEl); },
                });

                const lineEl = createEl('div', {
                    style: {
                        position: 'absolute',
                        top: '10px',
                        left: isRight ? '-40px' : '160px',
                        height: '2px',
                        width: '40px',
                        background: isGit ? '#c7d2fe' : '#e2e8f0',
                        borderRadius: '1px',
                        zIndex: '0',
                    }
                });
                nodeEl.appendChild(lineEl);

                const dotEl = createEl('div', { className: `tl-node-dot type-${evt.type}` });
                nodeEl.appendChild(dotEl);

                if (isGit) {
                    const checkbox = createEl('div', {
                        className: `tl-node-checkbox ${isSelected ? 'checked' : ''}`,
                        'data-node-id': evt.id,
                        onclick: (e) => { e.stopPropagation();
                            toggleGitNodeSelection(evt.id); }
                    });
                    if (isSelected) checkbox.innerHTML = '✓';
                    nodeEl.appendChild(checkbox);
                }

                if (isGit && evt.commitHash) {
                    const hashLabel = createEl('div', { className: 'tl-node-label git-hash' }, evt.commitHash);
                    nodeEl.appendChild(hashLabel);
                } else {
                    const typeLabels = { requirement: '需求', code: '编码', review: '审查', flowchart: '流程图',
                        backtest: '回测' };
                    const shortLabel = typeLabels[evt.type] || evt.label;
                    const labelEl = createEl('div', { className: 'tl-node-label' }, shortLabel);
                    nodeEl.appendChild(labelEl);
                }

                canvasInner.appendChild(nodeEl);
            });

            if (events.length >= 2) {
                for (let i = 0; i < events.length; i++) {
                    const yPos = topPad + (i / Math.max(events.length - 1, 1)) * usableHeight;
                    const tickEl = createEl('div', {
                        style: {
                            position: 'absolute',
                            top: yPos + 'px',
                            left: (axisX - 10) + 'px',
                            height: '1px',
                            width: '20px',
                            background: '#cbd5e1',
                            zIndex: '1',
                        }
                    });
                    canvasInner.appendChild(tickEl);
                }
            }
        }

        function applyTimelineTransform(smooth = false) {
            const canvasInner = document.getElementById('timeline-canvas-inner');
            if (!canvasInner) return;
            if (smooth) {
                canvasInner.classList.add('smooth-transition');
                setTimeout(() => canvasInner.classList.remove('smooth-transition'), 260);
            }
            canvasInner.style.transform =
                `scale(${timelineZoom}) translateX(${timelinePanX}px) translateY(${timelinePanY}px)`;
        }

        function updateZoomBadge() {
            const badge = document.getElementById('zoom-level-badge');
            if (badge) badge.textContent = Math.round(timelineZoom * 100) + '%';
        }

        function startTimelinePan(e) {
            if (e.target.closest('.tl-node') || e.target.closest('.tl-node-checkbox')) return;
            timelineIsPanning = true;
            timelinePanStart = { x: e.clientX, y: e.clientY };
            timelinePanStartPanX = timelinePanX;
            timelinePanStartPanY = timelinePanY;
            const canvasContainer = document.getElementById('timeline-canvas-container');
            if (canvasContainer) canvasContainer.classList.add('panning');
            document.addEventListener('mousemove', onTimelinePan);
            document.addEventListener('mouseup', stopTimelinePan);
        }

        function onTimelinePan(e) {
            if (!timelineIsPanning) return;
            const dx = (e.clientX - timelinePanStart.x) / timelineZoom;
            const dy = (e.clientY - timelinePanStart.y) / timelineZoom;
            timelinePanX = timelinePanStartPanX + dx;
            timelinePanY = timelinePanStartPanY + dy;
            applyTimelineTransform(false);
        }

        function stopTimelinePan() {
            timelineIsPanning = false;
            const canvasContainer = document.getElementById('timeline-canvas-container');
            if (canvasContainer) canvasContainer.classList.remove('panning');
            document.removeEventListener('mousemove', onTimelinePan);
            document.removeEventListener('mouseup', stopTimelinePan);
        }

        function handleTimelineWheel(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -0.06 : 0.06;
            timelineZoom = Math.max(0.2, Math.min(2.5, timelineZoom + delta));
            applyTimelineTransform(true);
            updateZoomBadge();
        }

        function startSidebarResize(e) { e.preventDefault();
            isResizingSidebar = true;
            document.body.style.cursor = 'col-resize';
            document.addEventListener('mousemove', onSidebarResize);
            document.addEventListener('mouseup', stopSidebarResize); }

        function onSidebarResize(e) { if (!isResizingSidebar) return;
            let newWidth = e.clientX;
            newWidth = Math.min(460, Math.max(200, newWidth));
            sidebarWidth = newWidth;
            const aside = document.querySelector('aside'); if (aside) aside.style.width = sidebarWidth + 'px'; }

        function stopSidebarResize() { isResizingSidebar = false;
            document.body.style.cursor = '';
            document.removeEventListener('mousemove', onSidebarResize);
            document.removeEventListener('mouseup', stopSidebarResize);
            renderApp(); }

        function startRightResize(e) { if (!rightPanelVisible) return;
            e.preventDefault();
            isResizingRight = true;
            document.body.style.cursor = 'col-resize';
            document.addEventListener('mousemove', onRightResize);
            document.addEventListener('mouseup', stopRightResize); }

        function onRightResize(e) { if (!isResizingRight || !rightPanelVisible) return;
            const container = document.querySelector('.flex.h-full.w-full'); if (!container) return;
            let newWidth = container.getBoundingClientRect().right - e.clientX;
            newWidth = Math.min(500, Math.max(280, newWidth));
            const rightPanel = document.querySelector('.flex.flex-col.bg-white.border-l.flex-shrink-0'); if (rightPanel)
                rightPanel.style.width = newWidth + 'px'; }

        function stopRightResize() { isResizingRight = false;
            document.body.style.cursor = '';
            const rightPanel = document.querySelector('.flex.flex-col.bg-white.border-l.flex-shrink-0'); if (rightPanel) { const
                    w = parseInt(rightPanel.style.width, 10); if (!isNaN(w) && w >= 100) rightPanelWidth = w; }
            document.removeEventListener('mousemove', onRightResize);
            document.removeEventListener('mouseup', stopRightResize); }

        function renderCreateSessionModal() {
            if (!createModalVisible) return createEl('div', {});
            const overlay = createEl('div', { className: 'fixed inset-0 z-[8000] flex items-center justify-center bg-black/40 backdrop-blur-sm',
                onclick: (e) => { if (e.target === overlay && createModalStep !== 2) closeCreateModal(); } });
            const card = createEl('div', { className: 'bg-white rounded-2xl shadow-2xl w-full max-w-[560px] mx-4 flex flex-col overflow-hidden',
                style: { animation: 'modalIn 0.25s ease-out', maxHeight: '85vh' }, onclick: (e) => e.stopPropagation() });
            const header = createEl('div', { className: 'flex items-center justify-between px-5 py-4 border-b border-border' });
            header.innerHTML =
                `<div class="flex items-center gap-2.5"><span class="w-5 h-5 text-primary" data-lucide="sparkles"></span><span class="font-semibold text-base">新建策略会话</span></div><button class="p-1.5 rounded-lg hover:bg-gray-100 transition-colors" id="modal-close-btn"><span class="w-4 h-4 text-muted-foreground" data-lucide="x"></span></button>`;
            card.appendChild(header);
            const stepper = createEl('div', { className: 'flex items-center justify-center px-8 py-4 gap-0' });
            const steps = [{ num: 1, label: '输入需求', status: createModalStep > 1 ? 'done' : (createModalStep === 1 ? 'active' :
                    'pending') }, { num: 2, label: 'AI 分析', status: createModalStep > 2 ? 'done' : (createModalStep === 2 ?
                    'active' : 'pending') }, { num: 3, label: '预览确定', status: createModalStep === 3 ? 'active' :
                'pending' }];
            steps.forEach((s, i) => { const stepWrapper = createEl('div', { className: 'flex items-center gap-0',
                    style: { flex: i < 2 ? '1 1 auto' : '0 0 auto' } });
                const dot = createEl('div', { className: `step-dot ${s.status==='active'?'active':(s.status==='done'?'done':'pending')}`,
                    style: { width: '32px', height: '32px', fontSize: '12px' } });
                dot.innerHTML = s.status === 'done' ? '<span class="w-4 h-4" data-lucide="check"></span>' :
                    `<span>${s.num}</span>`;
                stepWrapper.appendChild(dot);
                stepWrapper.appendChild(createEl('span', { className: `text-[11px] font-medium ml-2 whitespace-nowrap ${s.status==='active'?'text-primary':(s.status==='done'?'text-emerald-600':'text-gray-400')}` },
                    s.label)); if (i < 2) stepWrapper.appendChild(createEl('div', { className: `step-connector mx-2 ${s.status==='done'?'done':'pending'}`,
                    style: { flex: '1 1 auto', minWidth: '20px', maxWidth: '60px' } }));
                stepper.appendChild(stepWrapper); });
            card.appendChild(stepper);
            const contentArea = createEl('div', { className: 'flex-1 overflow-y-auto custom-scrollbar px-5 py-4 min-h-0' });
            if (createModalStep === 1) { contentArea.innerHTML = '';
                contentArea.appendChild(createEl('label', { className: 'block text-sm font-medium text-gray-700 mb-2' },
                    '请描述您的策略需求'));
                const textarea = createEl('textarea', { id: 'modal-step1-textarea',
                    className: 'w-full h-36 resize-none rounded-xl border border-border px-4 py-3 text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all',
                    placeholder: '例如：双均线策略，5日上穿20日买入，2%止损5%止盈...', value: createModalRawInput });
                contentArea.appendChild(textarea);
                contentArea.appendChild(createEl('p', { className: 'text-[11px] text-muted-foreground mt-2' },
                    '💡 描述越详细，AI 分析越精准。')); } else if (createModalStep === 2) { if (createModalIsAnalyzing) { contentArea
                    .innerHTML =
                    `<div class="flex flex-col items-center justify-center py-10 gap-4"><div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-primary ai-pulsing-dot"></span><span class="w-3 h-3 rounded-full bg-primary ai-pulsing-dot"></span><span class="w-3 h-3 rounded-full bg-primary ai-pulsing-dot"></span></div><p class="text-sm text-muted-foreground font-medium">AI 正在分析您的需求...</p></div>`; } else {
                    contentArea.innerHTML = '';
                    contentArea.appendChild(createEl('label', { className: 'block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5' },
                        '📌 策略标题'));
                    const titleInput = createEl('input', { id: 'modal-step2-title',
                        className: 'w-full px-3 py-2.5 rounded-lg border border-border text-sm font-medium bg-white focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary mb-4',
                        value: createModalTitle, placeholder: '输入策略标题' });
                    contentArea.appendChild(titleInput);
                    contentArea.appendChild(createEl('label', { className: 'block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5' },
                        '📋 需求清单'));
                    const reqContainer = createEl('div', { className: 'space-y-2 mb-3 max-h-52 overflow-y-auto custom-scrollbar' });
                    createModalRequirements.forEach(req => { const row = createEl('div', { className: 'req-item-row flex items-center gap-2 group' });
                        row.appendChild(createEl('input', { className: 'modal-req-input flex-1 px-3 py-2 rounded-lg border border-border text-sm bg-gray-50 focus:outline-none focus:ring-1 focus:ring-primary/20',
                            value: req.text, placeholder: '输入需求描述', 'data-req-id': req.id, oninput: (
                                e) => updateRequirementInModal(req.id, e.target.value) }));
                        const delBtn = createEl('button', { className: 'req-delete-btn p-1.5 rounded-lg hover:bg-red-50 text-red-400',
                            onclick: () => removeRequirementInModal(req.id) });
                        delBtn.innerHTML = '<span class="w-4 h-4" data-lucide="trash-2"></span>';
                        row.appendChild(delBtn);
                        reqContainer.appendChild(row); });
                    contentArea.appendChild(reqContainer);
                    const addBtn = createEl('button', { className: 'w-full py-2 border-2 border-dashed border-gray-300 rounded-lg text-xs text-muted-foreground hover:border-primary hover:text-primary',
                        onclick: addRequirementInModal });
                    addBtn.innerHTML = '<span class="w-3.5 h-3.5" data-lucide="plus"></span>新增需求';
                    contentArea.appendChild(addBtn); } } else { contentArea.innerHTML =
                    `<div class="mb-4"><p class="text-xs font-semibold text-gray-500 uppercase mb-1">📌 策略标题</p><p class="text-lg font-bold text-primary">${createModalTitle}</p></div><p class="text-xs font-semibold text-gray-500 uppercase mb-2">📋 需求清单</p><div class="space-y-2 bg-gray-50 rounded-xl p-3">${createModalRequirements.map((r,i)=>`<div class="flex items-start gap-2 text-sm"><span class="text-primary font-bold">${i+1}.</span><span>${r.text}</span></div>`).join('')}</div>`; }
            card.appendChild(contentArea);
            const footer = createEl('div', { className: 'flex items-center justify-between px-5 py-3.5 border-t border-border bg-gray-50/80 gap-3' });
            if (createModalStep === 1) footer.appendChild(createEl('button', { className: 'px-5 py-2.5 bg-primary text-white rounded-xl text-sm font-medium ml-auto',
                onclick: handleModalStep1Next }, '下一步：AI 分析'));
            else if (createModalStep === 2) { footer.appendChild(createEl('button', { className: 'px-4 py-2.5 border rounded-xl text-sm',
                    onclick: handleModalStep2Back, disabled: createModalIsAnalyzing }, '上一步'));
                footer.appendChild(createEl('button', { className: 'px-5 py-2.5 bg-primary text-white rounded-xl text-sm',
                    onclick: handleModalStep2Next, disabled: createModalIsAnalyzing }, '下一步：预览')); } else {
                footer.appendChild(createEl('button', { className: 'px-4 py-2.5 border rounded-xl text-sm',
                    onclick: handleModalStep3Back }, '上一步'));
                footer.appendChild(createEl('button', { className: 'px-5 py-2.5 bg-emerald-600 text-white rounded-xl text-sm',
                    onclick: handleModalConfirm }, '确认创建')); }
            card.appendChild(footer);
            overlay.appendChild(card);
            setTimeout(() => { document.getElementById('modal-close-btn')?.addEventListener('click', closeCreateModal);
                lucide.createIcons(); }, 30);
            return overlay;
        }

        window.triggerReview = triggerReview;
        window.runBacktest = runBacktest;
        window.autoGenFlowchartForSession = autoGenFlowchartForSession;
        window.getActiveSession = getActiveSession;
        window.showCreateSessionModal = window.showCreateSessionModal;
        window.openTimelineTab = openTimelineTab;
        window.closeTimelineTab = closeTimelineTab;
        document.addEventListener('DOMContentLoaded', () => renderApp());
    </script>
</body>
</html>
