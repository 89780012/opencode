<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strategy Service</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
        background: #eef4f7;
        color: #12222e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(26, 87, 110, 0.14), transparent 44%),
          linear-gradient(160deg, #f7fbfd 0%, #e6f0f4 100%);
      }

      main {
        width: min(480px, calc(100vw - 48px));
        padding: 32px 28px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.84);
        box-shadow: 0 24px 60px rgba(18, 34, 46, 0.12);
        backdrop-filter: blur(16px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.1;
      }

      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.6;
        color: #365262;
      }

      .dot {
        width: 12px;
        height: 12px;
        margin-bottom: 18px;
        border-radius: 999px;
        background: #1a576e;
        box-shadow: 0 0 0 rgba(26, 87, 110, 0.32);
        animation: pulse 1.6s infinite;
      }

      body[data-state="error"] .dot {
        background: #a62f2f;
        animation: none;
      }

      body[data-state="error"] p {
        color: #7c2525;
      }

      @keyframes pulse {
        0% {
          transform: scale(0.9);
          box-shadow: 0 0 0 0 rgba(26, 87, 110, 0.28);
        }

        70% {
          transform: scale(1);
          box-shadow: 0 0 0 16px rgba(26, 87, 110, 0);
        }

        100% {
          transform: scale(0.9);
          box-shadow: 0 0 0 0 rgba(26, 87, 110, 0);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="dot"></div>
      <h1>Strategy Service</h1>
      <p id="msg">Starting the local service and loading the desktop shell.</p>
    </main>
    <script>
      window.bootError = (msg) => {
        document.body.dataset.state = "error"
        document.getElementById("msg").textContent = msg || "Failed to start Strategy Service."
      }
    </script>
  </body>
</html>
