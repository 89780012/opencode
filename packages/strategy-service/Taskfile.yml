version: "3"

dotenv:
  - .env
  - .env.local

env:
  HOST: '{{default "127.0.0.1" .HOST}}'
  PORT: '{{default "5000" .PORT}}'
  STRATEGY_FRONT_DIST: '{{default "../strategy-front/dist" .STRATEGY_FRONT_DIST}}'
  STRATEGY_REQUIREMENT_BASE_URL: '{{default "https://smarttest.ztqft.com/" .STRATEGY_REQUIREMENT_BASE_URL}}'
  PLATFORM: "windows"
  ACCOUNT: "53191000978"
  WINDOWID: "1"
  STRATEGY_OPENCODE_ENABLED: '{{default "true" .STRATEGY_OPENCODE_ENABLED}}'
  STRATEGY_OPENCODE_HOST: '{{default "127.0.0.1" .STRATEGY_OPENCODE_HOST}}'
  STRATEGY_OPENCODE_PORT: '{{default "9999" .STRATEGY_OPENCODE_PORT}}'
  STRATEGY_OPENCODE_CWD: '{{default "" .STRATEGY_OPENCODE_CWD}}'
  STRATEGY_OPENCODE_START_TIMEOUT: '{{default "30s" .STRATEGY_OPENCODE_START_TIMEOUT}}'

tasks:
  default:
    desc: Default entry. Run strategy-service with env vars via `go run .`
    cmds:
      - task: run

  env:
    desc: Print the effective strategy-service environment
    cmds:
      - echo HOST={{.HOST}}
      - echo PORT={{.PORT}}
      - echo STRATEGY_FRONT_DIST={{.STRATEGY_FRONT_DIST}}
      - echo STRATEGY_REQUIREMENT_BASE_URL={{.STRATEGY_REQUIREMENT_BASE_URL}}
      - echo PLATFORM={{.PLATFORM}}
      - echo ACCOUNT={{.ACCOUNT}}
      - echo WINDOWID={{.WINDOWID}}
      - echo STRATEGY_OPENCODE_ENABLED={{.STRATEGY_OPENCODE_ENABLED}}
      - echo STRATEGY_OPENCODE_HOST={{.STRATEGY_OPENCODE_HOST}}
      - echo STRATEGY_OPENCODE_PORT={{.STRATEGY_OPENCODE_PORT}}
      - echo STRATEGY_OPENCODE_CWD={{.STRATEGY_OPENCODE_CWD}}
      - echo STRATEGY_OPENCODE_START_TIMEOUT={{.STRATEGY_OPENCODE_START_TIMEOUT}}

  run:
    desc: Run strategy-service through the legacy root entrypoint with env vars
    cmds:
      - go run .

  run:service:
    desc: Run strategy-service through the canonical entrypoint
    cmds:
      - go run ./cmd/service

  run:no-opencode:
    desc: Run strategy-service with OpenCode integration disabled
    env:
      STRATEGY_OPENCODE_ENABLED: "false"
    cmds:
      - task: run

  build:
    desc: Build the strategy-service binaries in the current package
    cmds:
      - go build ./...

  doctor:
    desc: Print env and verify the package builds
    cmds:
      - task: env
      - task: build
